<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMC Dash ’N’ Dine · Restaurant Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e4eaf3;--acc:#1d63ed;--acc2:#e6edff;--sb:#0f2044;--ok:#1f9d55;--warn:#d97706;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:42px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.dng{color:var(--bad)}button.sm{padding:4px 10px;min-height:36px}
#shell{display:flex;min-height:100%}
#sb{width:250px;background:var(--sb);color:#e8eefc;padding:20px 14px;display:flex;flex-direction:column;gap:2px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 18px}.brand i{width:46px;height:46px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 24px Inter,sans-serif;flex:none}.brand b{display:block;font-size:16px;color:#fff}.brand small{color:#9fb3d9;font-size:13px}.lbl{font-size:11px;letter-spacing:.14em;color:#8ea2cc;padding:16px 10px 6px}
#sb button{background:none;border:0;color:inherit;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:500}#sb button:hover{background:rgba(255,255,255,.07)}.ic{width:18px;text-align:center;opacity:.9}.sbuser{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 6px 0;display:flex;gap:10px;align-items:center}.sbuser small{display:block;color:#9fb3d9}.av{width:40px;height:40px;border-radius:50%;background:#e6edff;color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
#sb button.on{background:var(--acc);color:#fff;font-weight:700}
#mn{flex:1;min-width:0}
#top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 28px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
#top h1{font-size:19px}#top p{margin:2px 0 0;color:var(--mut);font-size:13px}.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:0}.usd{font-weight:600}.who select{width:auto}
main{padding:24px 28px 40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chips button{white-space:nowrap;border-radius:99px}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(15,32,68,.05)}.stat{position:relative}
.stat span{color:var(--mut);font-size:14px}.stat b{display:block;font-size:30px;font-weight:800;margin:6px 0 8px}.stat em{font-style:normal;color:var(--mut);font-size:12px}.chip{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}.chip.blue{background:#e6edff;color:#1d63ed}.chip.purple{background:#efe9fc;color:#7c4dd6}.chip.orange{background:#fdeedd;color:#e07b1a}.chip.green{background:#def7e8;color:#1f9d55}.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.welcome h2{font-size:30px;font-weight:800}.welcome p{margin:4px 0 0;color:var(--mut)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.box h3{margin:0 0 8px;font-size:17px}.box h3~h3{margin-top:16px}
.chart{display:flex;gap:8px;align-items:flex-end;height:190px;padding-top:10px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bc i{width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}.bc span{margin-top:4px}.bc b{font-weight:600;color:var(--ink)}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:4px}
.item{text-align:left;display:flex;flex-direction:column;gap:5px;padding:12px;min-height:104px}.item .p{margin-top:auto;font-weight:700;color:var(--acc);font-size:18px}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--acc2);display:inline-block;width:fit-content}.badge.ok{color:var(--ok)}.badge.low{color:var(--warn)}.badge.out{color:var(--bad)}
.ord{position:sticky;top:10px}.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row .n{flex:1;min-width:0}.row small{display:block;color:var(--mut)}
.qty{min-width:28px;text-align:center;font-weight:700}.amt{min-width:56px;text-align:right}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin:12px 0}.tot.sm{font-size:17px}
.pay,.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.quick{grid-template-columns:repeat(6,1fr)}.pay button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.big{width:100%;min-height:50px;font-size:17px;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.scroll{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px;background:#f5f7fb}
.v{text-decoration:line-through;opacity:.6}.empty{color:var(--mut);text-align:center;padding:18px 0}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(460px,94vw);padding:20px;max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.55)}
.rc{font-family:"Courier New",monospace;font-size:13px}.rc h3{text-align:center}.rc p{text-align:center;margin:2px 0}.rc div{display:flex;justify-content:space-between;gap:8px}.rc hr{border:0;border-top:1px dashed var(--mut)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;display:none}
#shell.lg{display:grid;place-items:center;min-height:100vh}#shell.lg #sb,#shell.lg #top{display:none}#shell.lg #mn{width:100%}#shell.lg main{display:grid;place-items:center;min-height:100vh}.lg-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(400px,92vw);box-shadow:0 8px 30px rgba(15,32,68,.08)}.lg-card h2{margin:6px 0 12px}.lg-card .brand{padding:0 0 14px}.lg-card .brand b{color:var(--ink)}.lg-card .brand small{color:var(--mut)}.usr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px}.usr small{display:block;color:var(--mut)}.err{color:var(--bad);margin:6px 0}#sb .so{margin-left:auto;padding:6px 10px;font-size:13px;border:1px solid rgba(255,255,255,.25);border-radius:8px}
@media (max-width:860px){#shell{display:block}#sb{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.brand,.lbl,.sbuser{display:none}#sb button{white-space:nowrap}.pos,.two{grid-template-columns:1fr}.ord{position:static}main,#top{padding-left:14px;padding-right:14px}}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:100%}.noprint{display:none}}
</style>
</head>
<body>
<div id="shell"><aside id="sb"></aside><div id="mn"><div id="top"></div><main id="app"></main></div></div>
<dialog id="dlg"></dialog><dialog id="rc"></dialog><div class="toast" id="toast"></div>
<script>
const K='dnd_pro1',CATS=['Fast food','Burgers','Meals','Extras','Drinks','Desserts'];
const D=[['Egg roll','Fast food',1,30],['French fries','Fast food',1,40],['Hot chips & Russian sausage','Fast food',1.5,30],['Value beef burger','Burgers',1.5,25],['Beef egg burger','Burgers',2,25],['Double burger','Burgers',2.5,20,1],['Traditional beef stew','Meals',1.5,25],['Rice & beef stew','Meals',2,25],['¼ chicken','Meals',3.5,20,1],['T-bone steak','Meals',4,15,1],['Pork chop','Meals',3,15,1],['Chicken roast with rice','Meals',2,20],['Chicken roast with sadza','Meals',2,20],['Steak pie','Meals',1.5,20],['Russian sausage','Extras',.5,40,1],['Egg','Extras',.5,40,1],['Coleslaw','Extras',.5,40,1],['Plain rice','Extras',1,30,1],['Scone','Extras',.25,40,1],['Plain sadza','Extras',.5,30,1],['Soft drink 300ml (2 for $1)','Drinks',.5,48,1],['Soft drink 330ml can','Drinks',.7,24],['Soft drink 440ml PET','Drinks',.7,24],['Minute Maid Refresh 400ml','Drinks',.5,24],['Minute Maid Delight 400ml','Drinks',1,24],['Mineral water 500ml','Drinks',.3,48],['Ice cream cone','Desserts',.5,30],['Flavoured yoghurt','Desserts',.6,24]];
const NAV=[['dash','Dashboard','Sales overview and business performance',1],['pos','New Sale / POS','Take customer orders and process payments',0],['hist','Sales History','View receipts and previous transactions',0],['inv','Inventory / Stock','Manage available stock',0],['menu','Menu Management','Manage food, drinks and prices',1],['cash','Expenses & Cash','Track money and reconcile shifts',0],['rep','Reports','Analyse sales and stock performance',1],['staff','Staff & Users','Manage cashiers and permissions',1],['set','Settings','Restaurant information and system settings',1]];
const IC={dash:'▦',pos:'+',hist:'▤',inv:'▣',menu:'☰',cash:'$',rep:'▥',staff:'♙',set:'⚙'};
const PL={Today:'Today',Yesterday:'Yesterday',Week:'Last 7 days',Month:'This month'};
const fresh=()=>({items:D.map((d,i)=>({id:'i'+i,n:d[0],c:d[1],p:d[2],cost:+(d[2]*.55).toFixed(2),st:d[3],low:5,on:true,chk:d[4]||0})),sales:[],exp:[],mv:[],shifts:[],users:[{id:'u1',n:'Manager',role:'Manager'},{id:'u2',n:'Cashier 1',role:'Cashier'}],cur:'u1',cfg:{name:'TMC Dash ’N’ Dine',addr:'',tel:'',foot:'Thank you for dining with us!'},nx:1});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.items)S=fresh();
const hp=x=>{let h=5381;for(const c of 'tmc'+x)h=(h*33)^c.charCodeAt(0);return String(h>>>0)};
const mig=()=>S.users.forEach(u=>{if(!u.pin)u.pin=hp(u.role==='Manager'?'1234':'0000')});mig();
let uid=null,pick=null,lerr='';try{uid=sessionStorage.getItem('dnd_u')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let pg='dash',per='Today',q='',cat='All',cart={},pay='Cash',rec='',invT='Stock',hf='All',FN=null;
const $=s=>document.querySelector(s),m=n=>'$'+Number(n).toFixed(2),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=id=>S.items.find(i=>i.id===id),cu=()=>S.users.find(u=>u.id===uid)||S.users[0],tm=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)},bad=t=>{toast(t);return false};
const day0=d=>{d=new Date(d);d.setHours(0,0,0,0);return+d},DY=864e5;
const inR=(t,p)=>{const s=day0(Date.now());if(p==='Today')return t>=s;if(p==='Yesterday')return t>=s-DY&&t<s;if(p==='Week')return t>=s-6*DY;const a=new Date();a.setDate(1);a.setHours(0,0,0,0);return t>=+a};
const chips=(vals,cur,a,lab)=>`<div class="chips">${vals.map(v=>`<button data-a="${a}" data-v="${v}" class="${cur===v?'on':''}">${lab?lab[v]:v}</button>`).join('')}</div>`;
const ss=i=>i.st<=0?['Out','out']:i.st<=i.low?['Low','low']:['In stock','ok'],bd=i=>{const s=ss(i);return`<span class="badge ${s[1]}">${s[0]}</span>`};
const table=(h,rows)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="empty">Nothing to show yet.</td></tr>`}</tbody></table></div>`;
const cinfo=()=>{let n=0,t=0;for(const id in cart){const i=find(id);if(i){n+=cart[id];t+=cart[id]*i.p}}return{n,t}};
function agg(p){const r={rev:0,n:0,pay:{},cogs:0,exp:0,cat:{},usr:{},it:{}};S.sales.forEach(s=>{if(s.st!=='ok'||!inR(s.t,p))return;r.rev+=s.tot;r.n++;r.pay[s.pay]=(r.pay[s.pay]||0)+s.tot;r.usr[s.u]=(r.usr[s.u]||0)+s.tot;s.lines.forEach(l=>{r.cogs+=l.q*l.cost;const it=find(l.id),c=it?it.c:'Other';r.cat[c]=(r.cat[c]||0)+l.q*l.p;r.it[l.n]=(r.it[l.n]||0)+l.q})});S.exp.forEach(e=>{if(inR(e.t,p))r.exp+=e.a});r.profit=r.rev-r.cogs-r.exp;return r}
function days7(){const o=[],s=day0(Date.now());for(let i=6;i>=0;i--){const a=s-i*DY;let v=0;S.sales.forEach(x=>{if(x.st==='ok'&&x.t>=a&&x.t<a+DY)v+=x.tot});o.push([new Date(a).toLocaleDateString(undefined,{weekday:'short'}),v])}return o}
function shc(sh){const e=sh.t1||Infinity;let cs=0,ce=0;S.sales.forEach(s=>{if(s.st==='ok'&&s.pay==='Cash'&&s.t>=sh.t0&&s.t<=e)cs+=s.tot});S.exp.forEach(x=>{if(x.cash&&x.t>=sh.t0&&x.t<=e)ce+=x.a});return{cs,ce,ex:sh.open+cs-ce}}
const mv=(i,q,ty,why)=>S.mv.push({t:Date.now(),n:i.n,q,ty,why:why||'',u:cu().n});
function form(title,fs,ok,btn){const d=$('#dlg');d.innerHTML=`<h2>${title}</h2>`+fs.map((f,i)=>`<label>${f.l}${f.o?`<select id="f${i}">${f.o.map(o=>`<option${o==f.v?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="f${i}" type="${f.t||'text'}" step="any" value="${esc(f.v)}">`}</label>`).join('')+`<div class="bar" style="margin-top:14px"><button data-a="x">Cancel</button><button class="pri" data-a="ok" style="flex:1">${btn||'Save'}</button></div>`;FN=()=>ok(fs.map((f,i)=>$('#f'+i).value));d.showModal()}
function rcpt(s){const d=$('#rc');d.innerHTML=`<div class="rc"><h3>${esc(S.cfg.name)}</h3><p>${esc(S.cfg.addr)} ${esc(S.cfg.tel)}</p><p>${s.id} · ${tm(s.t)}</p><p>Cashier: ${esc(s.u)}</p><hr>${s.lines.map(l=>`<div><span>${l.q} × ${esc(l.n)}</span><span>${m(l.q*l.p)}</span></div>`).join('')}<hr><div><b>TOTAL</b><b>${m(s.tot)}</b></div><div><span>${s.pay}</span><span>${m(s.rec)}</span></div><div><span>Change</span><span>${m(s.chg)}</span></div>${s.st==='void'?`<p><b>CANCELLED: ${esc(s.why)}</b></p>`:''}<hr><p>${esc(S.cfg.foot)}</p></div><div class="bar noprint" style="margin-top:12px"><button data-a="x">Close</button><button class="pri" onclick="window.print()">Print receipt</button></div>`;d.showModal()}
function posUp(){const b=$('#done');if(!b)return;const t=cinfo().t,r=parseFloat(rec);b.disabled=!(t>0&&(pay!=='Cash'||r>=t-1e-9));const c=$('#chg');if(c)c.textContent=isNaN(r)?'—':r>=t?m(r-t):'Short '+m(t-r)}
const P={
dash(){const r=agg(per),c=r.pay.Cash||0,low=S.items.filter(i=>i.st<=i.low),top=Object.entries(r.it).sort((a,b)=>b[1]-a[1]).slice(0,5),d7=days7(),mx=Math.max(1,...d7.map(x=>x[1]));
return `<div class="welcome"><div><h2>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(cu().n.split(' ')[0])}.</h2><p>Here is what’s happening at your restaurant.</p></div><button class="pri" data-p="pos">+ Start a sale</button></div>`+chips(Object.keys(PL),per,'per',PL)+`<div class="stats">${[['Sales',m(r.rev),'blue','$','Completed transactions'],['Transactions',r.n,'purple','▤','Sales completed'],['Low stock items',low.length,'orange','▣','At or below alert level'],['Expenses',m(r.exp),'green','$','Recorded expenses']].map(x=>`<div class="stat"><i class="chip ${x[2]}">${x[3]}</i><span>${x[0]}</span><b>${x[1]}</b><em>${x[4]}</em></div>`).join('')}</div><div class="stats">${[['Cash received',m(c)],['Electronic payments',m(r.rev-c)],['Estimated profit',m(r.profit)]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="two"><section class="box"><h3>Sales, last 7 days</h3><div class="chart">${d7.map(x=>`<div class="bc"><b>${x[1]?m(x[1]):''}</b><i style="height:${x[1]/mx*80}%"></i><span>${x[0]}</span></div>`).join('')}</div></section><section class="box"><h3>Best sellers</h3>${top.map(x=>`<div class="row"><span class="n">${esc(x[0])}</span><b>${x[1]} sold</b></div>`).join('')||'<p class="empty">No sales in this period.</p>'}<h3>Low stock (${low.length})</h3>${low.slice(0,6).map(i=>`<div class="row"><span class="n">${esc(i.n)}</span>${bd(i)} <b>${i.st}</b></div>`).join('')||'<p class="empty">All items are well stocked.</p>'}</section></div><section class="box" style="margin:14px 0"><div class="bar" style="justify-content:space-between"><div><h3>Recent sales</h3><p style="margin:2px 0 8px;color:var(--mut)">Latest completed transactions</p></div><button class="sm" data-p="hist">View all</button></div>${table(['Receipt','Cashier','Time','Payment','Total'],S.sales.slice(-7).reverse().map(s=>`<tr class="${s.st==='void'?'v':''}"><td><b>${s.id}</b></td><td>${esc(s.u)}</td><td>${tm(s.t)}</td><td>${s.pay}</td><td><b>${m(s.tot)}</b></td></tr>`))}</section><p style="color:var(--mut);font-size:13px">Profit is an estimate: sales minus the cost of items sold (set in Menu Management) minus expenses.</p>`},
pos(){const L=S.items.filter(i=>(cat==='All'||i.c===cat)&&(!q||(i.n+i.c).toLowerCase().includes(q.toLowerCase()))),ci=cinfo();
return`<div class="pos"><div><input id="q" type="search" placeholder="Search the menu: chicken, burger, coke…" value="${esc(q)}" aria-label="Search menu">${chips(['All',...CATS],cat,'cat')}<div class="grid">${L.map(i=>`<button class="item" data-a="add" data-id="${i.id}" ${!i.on||i.st<=0?'disabled':''}><b>${esc(i.n)}</b>${i.on?bd(i)+(i.st>0?` <small>${i.st} left</small>`:''):'<span class="badge out">Unavailable</span>'}<span class="p">${m(i.p)}</span></button>`).join('')||'<p class="empty">Nothing matches your search.</p>'}</div></div><aside class="box ord"><h3>Current order</h3>${Object.keys(cart).map(id=>{const i=find(id);return`<div class="row"><div class="n"><b>${esc(i.n)}</b><small>${m(i.p)} each</small></div><button class="sm" data-a="cq" data-id="${id}" data-v="-1" aria-label="Remove one">−</button><span class="qty">${cart[id]}</span><button class="sm" data-a="cq" data-id="${id}" data-v="1" aria-label="Add one">+</button><b class="amt">${m(i.p*cart[id])}</b></div>`}).join('')||'<p class="empty">Tap items to add them to the order.</p>'}<div class="tot"><span>Total</span><b>${m(ci.t)}</b></div><div class="pay">${['Cash','EcoCash','ZIPIT'].map(p=>`<button data-a="pay" data-v="${p}" class="${pay===p?'on':''}">${p}</button>`).join('')}</div>${pay==='Cash'?`<label for="rec">Amount received</label><input id="rec" type="number" step="any" inputmode="decimal" value="${rec}"><div class="quick">${['Exact',1,2,5,10,20].map(v=>`<button class="sm" data-a="qc" data-v="${v}">${v==='Exact'?'Exact':'$'+v}</button>`).join('')}</div><div class="tot sm"><span>Change to give</span><b id="chg"></b></div>`:''}<button class="pri big" id="done" data-a="done">Complete sale</button><button data-a="clear" style="width:100%">Clear order</button></aside></div>`},
hist(){const L=S.sales.filter(s=>inR(s.t,per)&&(hf==='All'||s.u===hf)).slice().reverse(),mg=cu().role==='Manager';
return chips(Object.keys(PL),per,'per',PL)+`<div class="bar"><label style="margin:0">Cashier <select id="hf" style="width:auto">${['All',...S.users.map(u=>u.n)].map(u=>`<option${u===hf?' selected':''}>${esc(u)}</option>`).join('')}</select></label></div>`+table(['Receipt','Time','Cashier','Items','Total','Payment','Status',''],L.map(s=>`<tr class="${s.st==='void'?'v':''}"><td>${s.id}</td><td>${tm(s.t)}</td><td>${esc(s.u)}</td><td>${s.lines.reduce((a,l)=>a+l.q,0)}</td><td><b>${m(s.tot)}</b></td><td>${s.pay}</td><td>${s.st==='void'?'Cancelled':'Paid'}</td><td><button class="sm" data-a="view" data-id="${s.id}">Receipt</button> ${mg&&s.st==='ok'?`<button class="sm dng" data-a="void" data-id="${s.id}">Cancel</button>`:''}</td></tr>`))},
inv(){const it=S.items.slice().sort((a,b)=>(a.st-a.low)-(b.st-b.low)),val=S.items.reduce((a,i)=>a+i.st*i.cost,0),low=S.items.filter(i=>i.st<=i.low).length;
return`<div class="stats"><div class="stat"><span>Items tracked</span><b>${S.items.length}</b></div><div class="stat"><span>Low or out</span><b>${low}</b></div><div class="stat"><span>Stock value (at cost)</span><b>${m(val)}</b></div></div>`+chips(['Stock','Movements'],invT,'invt')+(invT==='Stock'?table(['Item','Category','Available','Status','Value',''],it.map(i=>`<tr><td><b>${esc(i.n)}</b></td><td>${i.c}</td><td>${i.st}</td><td>${bd(i)}</td><td>${m(i.st*i.cost)}</td><td><button class="sm" data-a="sin" data-id="${i.id}">Add stock</button> <button class="sm" data-a="adj" data-id="${i.id}">Adjust</button></td></tr>`)):table(['Time','Item','Change','Type','Note','By'],S.mv.slice(-80).reverse().map(x=>`<tr><td>${tm(x.t)}</td><td>${esc(x.n)}</td><td><b>${x.q>0?'+':''}${x.q}</b></td><td>${x.ty}</td><td>${esc(x.why)}</td><td>${esc(x.u)}</td></tr>`)))},
menu(){return`<div class="bar"><button class="pri" data-a="inew">Add menu item</button><span style="color:var(--mut);font-size:13px">Items marked “Confirm price” came from the handwritten list. Cost is an estimate until you set it.</span></div>`+table(['Item','Category','Price','Cost','Available',''],S.items.map(i=>`<tr><td><b>${esc(i.n)}</b> ${i.chk?'<span class="badge low">Confirm price</span>':''}</td><td>${i.c}</td><td>${m(i.p)}</td><td>${m(i.cost)}</td><td><button class="sm" data-a="tog" data-id="${i.id}">${i.on?'Available':'Unavailable'}</button></td><td><button class="sm" data-a="iedit" data-id="${i.id}">Edit</button> <button class="sm dng" data-a="idel" data-id="${i.id}">Delete</button></td></tr>`))},
cash(){const u=cu(),sh=S.shifts.find(s=>!s.t1&&s.u===u.n),c=sh&&shc(sh);
return`<div class="two"><section class="box"><h3>Cash drawer: ${esc(u.n)}</h3>${sh?`<div class="row"><span class="n">Opening cash</span><b>${m(sh.open)}</b></div><div class="row"><span class="n">Cash sales</span><b>${m(c.cs)}</b></div><div class="row"><span class="n">Cash expenses</span><b>−${m(c.ce)}</b></div><div class="row"><span class="n">Expected cash in drawer</span><b>${m(c.ex)}</b></div><p><button class="pri" data-a="shut">Close shift and count cash</button></p>`:`<p>No shift is open. Enter the cash in the drawer to start.</p><button class="pri" data-a="shin">Open shift</button>`}</section><section class="box"><h3>Past shifts</h3>${S.shifts.filter(s=>s.t1).slice(-6).reverse().map(s=>`<div class="row"><span class="n">${esc(s.u)}<small>${tm(s.t1)}</small></span><b style="color:var(${s.diff<0?'--bad':'--ok'})">${s.diff===0?'Balanced':(s.diff>0?'Surplus ':'Short ')+m(Math.abs(s.diff))}</b></div>`).join('')||'<p class="empty">No closed shifts yet.</p>'}</section></div><div class="bar" style="margin-top:14px"><h3>Expenses</h3><button class="pri" data-a="enew">Record expense</button></div>`+table(['Time','Description','Paid from','Amount','By'],S.exp.slice(-40).reverse().map(e=>`<tr><td>${tm(e.t)}</td><td>${esc(e.d)}</td><td>${e.cash?'Cash drawer':'Other'}</td><td><b>${m(e.a)}</b></td><td>${esc(e.u)}</td></tr>`))},
rep(){const r=agg(per),sv=S.items.reduce((a,i)=>a+i.st*i.cost,0),rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span class="n">${esc(x[0])}</span><b>${m(x[1])}</b></div>`).join('')||'<p class="empty">No data.</p>';
return chips(Object.keys(PL),per,'per',PL)+`<div class="stats">${[['Revenue',m(r.rev)],['Cost of items sold',m(r.cogs)],['Expenses',m(r.exp)],['Estimated profit',m(r.profit)],['Stock on hand (cost)',m(sv)]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="two"><section class="box"><h3>Sales by category</h3>${rows(r.cat)}<h3>Sales by payment method</h3>${rows(r.pay)}<h3>Sales by cashier</h3>${rows(r.usr)}</section><section class="box"><h3>Products sold</h3>${Object.entries(r.it).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span class="n">${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<p class="empty">No data.</p>'}</section></div><p><button data-a="crep">Copy summary</button></p>`},
staff(){return`<div class="bar"><button class="pri" data-a="unew">Add user</button></div>`+table(['Name','Role','Can do',''],S.users.map(u=>`<tr><td><b>${esc(u.n)}</b></td><td>${u.role}</td><td>${u.role==='Manager'?'Everything, including reports, menu, cancellations':'Sales, stock view, cash and expenses'}</td><td><button class="sm" data-a="uren" data-id="${u.id}">Rename</button> <button class="sm" data-a="upin" data-id="${u.id}">Set PIN</button> ${u.id===uid?'<span style="color:var(--mut)">You</span>':`<button class="sm dng" data-a="udel" data-id="${u.id}">Remove</button>`}</td></tr>`))+`<p style="color:var(--mut);font-size:13px">Staff sign in with a PIN. This is a convenience lock for the browser version, not strong security. The PHP/MySQL version has real passwords.</p>`},
set(){const c=S.cfg;return`<section class="box" style="max-width:520px"><h3>Restaurant information</h3>${[['sn','Name',c.name],['sa','Address',c.addr],['st','Phone',c.tel],['sf','Receipt footer',c.foot]].map(x=>`<label>${x[1]}<input id="${x[0]}" value="${esc(x[2])}"></label>`).join('')}<p><button class="pri" data-a="sset">Save settings</button></p><h3>Backup</h3><p style="color:var(--mut)">Data is stored in this browser. Copy a backup regularly.</p><div class="bar"><button data-a="bk">Copy backup</button><button data-a="rs">Restore backup</button><button class="dng" data-a="reset">Reset everything</button></div></section>`}};
function loginView(){const u=pick&&S.users.find(x=>x.id===pick);
return `<div class="lg-card"><div class="brand"><i>T</i><div><b>TMC DASH 'N' DINE</b><small>Restaurant POS</small></div></div>`+(u?`<h2>Hello, ${esc(u.n)}</h2><label>Enter your PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>${lerr?`<p class="err">${lerr}</p>`:''}<div class="bar" style="margin-top:14px"><button data-a="lback">Back</button><button class="pri" data-a="lgo" style="flex:1">Sign in</button></div>`:`<h2>Who is signing in?</h2>${S.users.map(x=>`<button class="usr" data-a="lpick" data-id="${x.id}"><span class="av">${esc(x.n[0])}</span><span><b>${esc(x.n)}</b><small>${x.role}</small></span></button>`).join('')}<p class="small" style="color:var(--mut)">Starting PINs: Manager 1234, cashiers 0000. Change them after signing in.</p>`)+`</div>`}
function render(){if(!uid||!S.users.some(x=>x.id===uid)){uid=null;$('#shell').classList.add('lg');$('#sb').innerHTML='';$('#top').innerHTML='';$('#app').innerHTML=loginView();const pi=$('#pin');if(pi)pi.focus();return}$('#shell').classList.remove('lg');const u=cu(),mg=u.role==='Manager';if(NAV.find(x=>x[0]===pg)[3]&&!mg)pg='pos';const n=NAV.find(x=>x[0]===pg);
$('#sb').innerHTML=`<div class="brand"><i>T</i><div><b>TMC DASH 'N' DINE</b><small>Restaurant POS</small></div></div><div class="lbl">WORKSPACE</div>`+NAV.filter(x=>!x[3]||mg).map(x=>(x[0]==='inv'?'<div class="lbl">MANAGEMENT</div>':'')+`<button data-p="${x[0]}" class="${pg===x[0]?'on':''}"><span class="ic">${IC[x[0]]}</span>${x[1]}</button>`).join('')+`<div class="sbuser"><span class="av">${esc(u.n[0])}</span><div><b>${esc(u.n)}</b><small>${u.role}</small></div><button class="so" data-a="logout">Sign out</button></div>`;
$('#top').innerHTML=`<div><h1>${n[1]}</h1><p>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><label class="who"><span class="usd">USD</span><span class="av" style="width:38px;height:38px">${esc(u.n[0])}</span><span>${esc(u.n)}</span><button class="sm" data-a="mypin">My profile</button><button class="sm" data-a="logout">Sign out</button></label>`;
const f=document.activeElement&&document.activeElement.id==='q',p=f?document.activeElement.selectionStart:0;
$('#app').innerHTML=P[pg]();if(f){const e=$('#q');if(e){e.focus();e.setSelectionRange(p,p)}}posUp()}
const ren=(u,n)=>{const o=u.n;u.n=n;[S.sales,S.exp,S.mv,S.shifts].forEach(a=>a.forEach(x=>{if(x.u===o)x.u=n}));if(hf===o)hf=n};
const nameTaken=(u,n)=>S.users.some(x=>x.id!==u.id&&x.n.toLowerCase()===n.toLowerCase());
const A={per:v=>{per=v},cat:v=>{cat=v},invt:v=>{invT=v},pay:v=>{pay=v},clear:()=>{cart={};rec=''},
add:(v,id)=>{const i=find(id);if((cart[id]||0)>=i.st)return toast('No more '+i.n+' in stock');cart[id]=(cart[id]||0)+1},
cq:(v,id)=>{const i=find(id),n=(cart[id]||0)+ +v;if(n>i.st)return toast('Not enough stock');if(n<=0)delete cart[id];else cart[id]=n},
qc:v=>{rec=v==='Exact'?cinfo().t.toFixed(2):v},
done(){const ci=cinfo(),lines=[];if(!ci.n)return;for(const id in cart){const i=find(id);if(cart[id]>i.st)return toast('Only '+i.st+' '+i.n+' left')}
for(const id in cart){const i=find(id);i.st-=cart[id];mv(i,-cart[id],'Sale');lines.push({id,n:i.n,q:cart[id],p:i.p,cost:i.cost})}
const r=pay==='Cash'?parseFloat(rec):ci.t,s={id:'R'+String(S.nx++).padStart(4,'0'),t:Date.now(),u:cu().n,lines,tot:ci.t,pay,rec:r,chg:r-ci.t,st:'ok'};S.sales.push(s);save();cart={};rec='';toast('Sale complete · '+m(s.tot));setTimeout(()=>{render();rcpt(s)})},
view:(v,id)=>rcpt(S.sales.find(s=>s.id===id)),
void:(v,id)=>{const s=S.sales.find(x=>x.id===id);form('Cancel '+id,[{l:'Reason for cancelling',v:''}],r=>{if(!r[0].trim())return bad('Enter a reason');s.st='void';s.why=r[0];s.lines.forEach(l=>{const i=find(l.id);if(i){i.st+=l.q;mv(i,l.q,'Cancelled sale',id)}});save();render()},'Cancel sale')},
sin:(v,id)=>{const i=find(id);form('Add stock: '+esc(i.n),[{l:'Quantity received',t:'number',v:''},{l:'Supplier or note',v:''}],r=>{const n=parseFloat(r[0]);if(!(n>0))return bad('Enter a quantity');i.st+=n;mv(i,n,'Purchase',r[1]);save();render()},'Add stock')},
adj:(v,id)=>{const i=find(id);form('Adjust: '+esc(i.n),[{l:'Type',o:['Damaged','Expired','Stock count (set exact)'],v:'Damaged'},{l:'Quantity',t:'number',v:''}],r=>{const n=parseFloat(r[1]);if(isNaN(n)||n<0)return bad('Enter a quantity');const d=r[0][0]==='S'?n-i.st:-Math.min(n,i.st);i.st+=d;mv(i,d,r[0]);save();render()})},
tog:(v,id)=>{const i=find(id);i.on=!i.on;save()},
inew:()=>A.iedit(),
iedit(v,id){const i=id?find(id):null,o=i||{n:'',c:'Meals',p:'',cost:'',low:5,st:0};form(i?'Edit item':'Add menu item',[{l:'Name',v:o.n},{l:'Category',o:CATS,v:o.c},{l:'Price (USD)',t:'number',v:o.p},{l:'Cost per item (USD)',t:'number',v:o.cost},{l:'Low-stock alert at',t:'number',v:o.low}].concat(i?[]:[{l:'Opening stock',t:'number',v:0}]),r=>{const p=parseFloat(r[2]);if(!r[0].trim()||isNaN(p))return bad('Enter a name and price');const x=i||{id:'n'+S.nx++,on:true,chk:0,st:parseFloat(r[5])||0};x.n=r[0].trim();x.c=r[1];x.p=p;x.cost=parseFloat(r[3])||+(p*.55).toFixed(2);x.low=parseInt(r[4])||0;x.chk=0;if(!i)S.items.push(x);save();render()})},
idel:(v,id)=>{if(confirm('Delete this item? Past sales keep their records.')){S.items=S.items.filter(i=>i.id!==id);delete cart[id];save()}},
enew:()=>form('Record expense',[{l:'Description',v:''},{l:'Amount (USD)',t:'number',v:''},{l:'Paid from',o:['Cash drawer','Other'],v:'Cash drawer'}],r=>{const a=parseFloat(r[1]);if(!r[0].trim()||!(a>0))return bad('Enter a description and amount');S.exp.push({t:Date.now(),d:r[0],a,cash:r[2]==='Cash drawer',u:cu().n});save();render()}),
shin:()=>form('Open shift',[{l:'Opening cash in drawer (USD)',t:'number',v:''}],r=>{const o=parseFloat(r[0]);if(isNaN(o)||o<0)return bad('Enter the opening cash');S.shifts.push({u:cu().n,open:o,t0:Date.now()});save();render()},'Open shift'),
shut(){const sh=S.shifts.find(s=>!s.t1&&s.u===cu().n),c=shc(sh);form('Close shift · expected '+m(c.ex),[{l:'Cash actually counted (USD)',t:'number',v:''}],r=>{const n=parseFloat(r[0]);if(isNaN(n))return bad('Enter the counted cash');sh.t1=Date.now();sh.cnt=n;sh.diff=+(n-c.ex).toFixed(2);save();toast(sh.diff===0?'Drawer balances':(sh.diff>0?'Surplus ':'Shortage ')+m(Math.abs(sh.diff)));render()},'Close shift')},
unew:()=>form('Add user',[{l:'Name',v:''},{l:'Role',o:['Cashier','Manager'],v:'Cashier'},{l:'PIN (4 to 8 digits)',t:'password',v:''}],r=>{if(!r[0].trim())return bad('Enter a name');if(!/^\d{4,8}$/.test(r[2]))return bad('PIN must be 4 to 8 digits');S.users.push({id:'u'+S.nx++,n:r[0].trim(),role:r[1],pin:hp(r[2])});save();render()}),
udel:(v,id)=>{if(confirm('Remove this user?')){S.users=S.users.filter(u=>u.id!==id);save()}},
sset:()=>{S.cfg={name:$('#sn').value,addr:$('#sa').value,tel:$('#st').value,foot:$('#sf').value};save();toast('Settings saved')},
bk:()=>{const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Backup copied. Paste it into a safe file.'),()=>prompt('Copy this backup:',t))},
rs:()=>{const t=prompt('Paste your backup here');if(!t)return;try{const o=JSON.parse(t);if(!o.items)throw 0;S=o;mig();save();toast('Backup restored')}catch(e){toast('That backup is not valid')}},
reset:()=>{if(confirm('Erase all sales, stock and settings?')){S=fresh();mig();cart={};save()}},
crep(){const r=agg(per);const t=`${S.cfg.name} · ${PL[per]}\nSales ${m(r.rev)} (${r.n} orders)\nCost of items ${m(r.cogs)}\nExpenses ${m(r.exp)}\nEstimated profit ${m(r.profit)}`;navigator.clipboard.writeText(t).then(()=>toast('Summary copied'),()=>alert(t))},
lpick:(v,id)=>{pick=id;lerr=''},lback:()=>{pick=null;lerr=''},
lgo(){const u=S.users.find(x=>x.id===pick),v=$('#pin')?$('#pin').value:'';if(u&&hp(v)===u.pin){uid=u.id;try{sessionStorage.setItem('dnd_u',uid)}catch(e){}pick=null;lerr='';cart={};rec='';pg=u.role==='Manager'?'dash':'pos'}else lerr='Wrong PIN. Please try again.'},
logout(){uid=null;pick=null;lerr='';cart={};rec='';try{sessionStorage.removeItem('dnd_u')}catch(e){}},
upin:(v,id)=>{const u=S.users.find(x=>x.id===id);form('Set PIN: '+esc(u.n),[{l:'New PIN (4 to 8 digits)',t:'password',v:''}],r=>{if(!/^\d{4,8}$/.test(r[0]))return bad('PIN must be 4 to 8 digits');u.pin=hp(r[0]);save();toast('PIN updated')})},
uren:(v,id)=>{const u=S.users.find(x=>x.id===id);form('Rename '+esc(u.n),[{l:'New name (for example Ben or Susan)',v:u.n}],r=>{const n=r[0].trim();if(!n)return bad('Enter a name');if(nameTaken(u,n))return bad('Another user already has that name');ren(u,n);save();toast('Name changed to '+n);render()})},
mypin:()=>{const u=cu();form('My profile',[{l:'Your name',v:u.n},{l:'Current PIN (only needed to change your PIN)',t:'password',v:''},{l:'New PIN, 4 to 8 digits (leave blank to keep)',t:'password',v:''}],r=>{const n=r[0].trim();if(!n)return bad('Enter your name');if(nameTaken(u,n))return bad('Another user already has that name');if(r[2]){if(hp(r[1])!==u.pin)return bad('Current PIN is wrong');if(!/^\d{4,8}$/.test(r[2]))return bad('PIN must be 4 to 8 digits');u.pin=hp(r[2])}ren(u,n);save();toast('Profile updated');render()})},
x:()=>{$('#dlg').close();$('#rc').close()},
ok(){if(FN&&FN()!==false)$('#dlg').close()}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p){pg=b.dataset.p;render();scrollTo(0,0);return}const a=b.dataset.a;if(a&&A[a]){A[a](b.dataset.v,b.dataset.id);if(a==='done')return;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}if(e.target.id==='rec'){rec=e.target.value;posUp()}});
document.addEventListener('change',e=>{if(e.target.id==='hf'){hf=e.target.value;render()}if(e.target.id==='cu'){S.cur=e.target.value;cart={};save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin'){A.lgo();render()}});
render();
</script>
